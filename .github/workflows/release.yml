name: Release

# Pushing a tag such as v1.0.0 builds the zip and publishes the GitHub release,
# with the notes taken from that version's section of CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build zip and release notes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          $build = .\tools\Build-Release.ps1 -OutputPath dist
          if ("v$($build.Version)" -ne $tag) { throw "Tag $tag does not match the version in src\Collector.ps1 ($($build.Version))" }

          $changelog = [IO.File]::ReadAllText("$PWD\CHANGELOG.md")
          $section = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($build.Version))\][^\r\n]*\r?\n(.*?)(?=^## \[|^\[\d|\z)")
          if (-not $section.Success) { throw "CHANGELOG.md has no section for $($build.Version)" }
          $notes = $section.Groups[1].Value.Trim() + "`n`n**SHA-256** of ``PCScope-$($build.Version).zip``: ``$($build.Sha256)``"
          [IO.File]::WriteAllText("$PWD\dist\notes.md", $notes, (New-Object Text.UTF8Encoding($false)))

      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip', '.sha256' } | ForEach-Object { $_.FullName })
          gh release create '${{ github.ref_name }}' @assets --title 'PCScope ${{ github.ref_name }}' --notes-file dist\notes.md --latest
          if ($LASTEXITCODE) { throw "gh release create failed ($LASTEXITCODE)" }
