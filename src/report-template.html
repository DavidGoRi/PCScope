<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --border: #dfe3e8;
  --text: #1c2430; --muted: #5d6b7c; --accent: #2563eb; --accent-soft: #e3ecfd;
  --ok: #1a7f4b; --ok-soft: #e1f4ea; --warn: #b45309; --warn-soft: #fdf0dc;
  --crit: #c62828; --crit-soft: #fde4e4; --info: #6b7280; --info-soft: #eceef1;
  --bar: #3b82f6; --shadow: 0 1px 2px rgba(16, 24, 40, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1419; --surface: #171d24; --surface-2: #1f2730; --border: #2c3641;
    --text: #e6eaef; --muted: #93a1b0; --accent: #6ea0ff; --accent-soft: #1d2b45;
    --ok: #4cc38a; --ok-soft: #15301f; --warn: #f0a548; --warn-soft: #382812;
    --crit: #f07070; --crit-soft: #3d1a1a; --info: #9aa5b1; --info-soft: #252d36;
    --bar: #5b93f5; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1419; --surface: #171d24; --surface-2: #1f2730; --border: #2c3641;
  --text: #e6eaef; --muted: #93a1b0; --accent: #6ea0ff; --accent-soft: #1d2b45;
  --ok: #4cc38a; --ok-soft: #15301f; --warn: #f0a548; --warn-soft: #382812;
  --crit: #f07070; --crit-soft: #3d1a1a; --info: #9aa5b1; --info-soft: #252d36;
  --bar: #5b93f5; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
}
header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.brand { font-weight: 700; font-size: 18px; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 22px; height: 22px; color: var(--accent); }
.meta { color: var(--muted); font-size: 13px; }
nav { display: flex; gap: 4px; margin-left: auto; }
nav button, .btn {
  background: transparent; border: 1px solid transparent; color: var(--muted);
  padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit;
}
nav button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.btn { border-color: var(--border); color: var(--text); background: var(--surface); }
.btn:hover, nav button:hover { border-color: var(--border); }
main { padding: 20px 24px 40px; max-width: 1400px; margin: 0 auto; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); }
.tile .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
.tile .value { font-size: 26px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile.crit .value { color: var(--crit); } .tile.warn .value { color: var(--warn); } .tile.ok .value { color: var(--ok); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
.toolbar { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.toolbar h2 { font-size: 15px; margin: 0 auto 0 0; }
input[type="search"] {
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 7px 10px; font: inherit; width: 260px; max-width: 100%;
}
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; background: var(--surface-2); }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text); }
th .arrow { opacity: .6; margin-left: 4px; }
tbody tr:last-child td { border-bottom: none; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
td.num { font-variant-numeric: tabular-nums; }
.wrap { white-space: normal; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.info { background: var(--info-soft); color: var(--info); }
.meter { display: inline-flex; align-items: center; gap: 8px; }
.meter .track { display: block; width: 90px; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
.meter .fill { display: block; height: 100%; background: var(--bar); }
.meter.warn .fill { background: var(--warn); } .meter.crit .fill { background: var(--crit); }
.detail-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
.detail-head h1 { margin: 0; font-size: 22px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
.card h3 { margin: 0; padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--border); }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; padding: 12px 16px; }
dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
.issues { list-style: none; margin: 0; padding: 8px 16px 12px; }
.issues li { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--border); }
.issues li:last-child { border-bottom: none; }
.span-all { grid-column: 1 / -1; }
.sub { color: var(--muted); font-size: 12px; }
.hidden { display: none !important; }
.chips { gap: 6px; padding-top: 8px; padding-bottom: 8px; }
.chip { padding: 3px 10px; font-size: 12px; }
.chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
code { font: 12px Consolas, "Cascadia Mono", monospace; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
@media (max-width: 640px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  nav { margin-left: 0; }
  .grid { grid-template-columns: 1fr; }
  input[type="search"] { width: 100%; }
}
</style>
</head>

  [/^Disk removed: (.+)$/, (m, n) => `Disco retirado: ${n}`],
  [/^Edition: (.+)$/, (m, a) => `Edición: ${a}`],
  [/^Feature update: (.+)$/, (m, a) => `Actualización de versión: ${a}`],
  [/^Update installed: build (.+)$/, (m, a) => `Actualización instalada: compilación ${a}`],
  [/^Antivirus installed: (.+)$/, (m, a) => `Antivirus instalado: ${a}`],
  [/^Antivirus removed: (.+)$/, (m, a) => `Antivirus desinstalado: ${a}`],
  [/^Firewall \((.+)\) (enabled|disabled)$/, (m, p, s) => `Cortafuegos (${term(p)}) ${onOff(s)}`],
  [/^(UAC|Secure Boot) (enabled|disabled)$/, (m, w, s) => `${w === "Secure Boot" ? "Arranque seguro" : w} ${onOff(s)}`],
  [/^New local administrator: (.+)$/, (m, a) => `Nuevo administrador local: ${a}`],

  [/^Network adapter removed: (.+)$/, (m, a) => `Adaptador de red retirado: ${a}`],
  [/^IP address: (.+)$/, (m, a) => `Dirección IP: ${a}`],
  [/^Main user: (.+)$/, (m, a) => `Usuario principal: ${a}`],
  [/^(.+) (enabled|disabled)$/, (m, n, s) => `${n} ${onOff(s)}`],
];

function detectLanguage() {
  const fromUrl = new URLSearchParams(location.search).get("lang");
  if (fromUrl && I18N[fromUrl]) return fromUrl;
  try { const saved = localStorage.getItem("pcscope-lang"); if (saved && I18N[saved]) return saved; } catch (err) { /* storage unavailable */ }
  return (navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en";
}
let LANG = detectLanguage();

function t(key, vars) {
  const value = key in I18N[LANG] ? I18N[LANG][key] : (key in I18N.en ? I18N.en[key] : key);
  return typeof value === "function" ? value(vars) : value;
}
const term = s => LANG === "es" && s != null && s in TERMS_ES ? TERMS_ES[s] : s;
const terms = s => String(s).split(", ").map(term).join(", ");
const dec = s => LANG === "es" ? String(s).replace(".", ",") : String(s);
const num = v => (v === null || v === undefined || v === "") ? "—" : (typeof v === "number" ? v.toLocaleString(LANG === "es" ? "es-ES" : "en-US") : esc(v));
function msg(text) {
  if (LANG !== "es" || !text) return text;
  for (const [pattern, translate] of ES_MESSAGES) {
    const match = String(text).match(pattern);
    if (match) return translate(...match);
  }
  return text;
}

/* ---------- helpers ---------- */
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dash = v => (v === null || v === undefined || v === "") ? "—" : esc(v);
const list = v => Array.isArray(v) ? v : (v == null ? [] : [v]);
const fmtDate = s => s ? esc(String(s).replace("T", " ").slice(0, 16)) : "—";
const daysSince = s => s ? Math.floor((Date.now() - new Date(s).getTime()) / 86400000) : null;
const pill = (level, text) => `<span class="pill ${level}">${esc(text)}</span>`;
const yesNo = v => v === true ? pill("ok", t("yes")) : v === false ? pill("warn", t("no")) : pill("info", t("unknown"));
const LEVELS = { crit: 3, warn: 2, info: 1, ok: 0 };
const levelText = level => t("level." + level);

function meter(percent) {
  if (percent == null) return "—";
  const level = percent >= 90 ? "crit" : percent >= 80 ? "warn" : "";
  return `<span class="meter ${level}"><span class="track"><span class="fill" style="width:${Math.min(100, percent)}%"></span></span>${esc(percent)}%</span>`;
}

/* ---------- health issues (evaluated by Rules.ps1 from rules.json) ---------- */
const LEVEL_CLASS = { critical: "crit", warning: "warn", info: "info" };
DEVICES.forEach(d => {
  d._issues = list(ISSUES[d.computerName]).map(i => ({ level: LEVEL_CLASS[i.level] || "info", text: i.message, rule: i.rule }));
  d._status = d._issues.some(i => i.level === "crit") ? "crit" : d._issues.some(i => i.level === "warn") ? "warn" : "ok";
});

/* ---------- state ---------- */
const state = { view: "devices", filter: "", sort: { key: "status", dir: -1 }, swFilter: "", issueFilter: "", changeFilter: "", notableOnly: false };

/* ---------- CSV export of the current view ---------- */
let currentExport = null;   // { file, headers, rows } set by each view
function exportButton() { return `<button class="btn" data-export title="${esc(t("exportTitle"))}">${esc(t("export"))}</button>`; }
function downloadCsv(spec) {
  // Excel expects ";" where the decimal separator is a comma (es-ES, fr-FR...)
  const sep = (1.5).toLocaleString().includes(",") ? ";" : ",";
  const cell = v => { const s = v == null ? "" : String(v); return /[";,\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [spec.headers, ...spec.rows].map(r => r.map(cell).join(sep));
  const bom = String.fromCharCode(0xFEFF);   // lets Excel detect UTF-8
  const url = URL.createObjectURL(new Blob([bom + lines.join("\r\n")], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = spec.file;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- history of changes (computed by History.ps1) ---------- */
DEVICES.forEach(d => { d._changes = list(CHANGES[d.computerName]); });
const CATEGORY_ICON = { Software: "▣", Hardware: "⚙", Storage: "◧", Windows: "⊞", Security: "⛨", Network: "⇄", Users: "☺" };
function changeRow(c, withDevice) {
  return `<tr class="${withDevice ? "clickable" : ""}" ${withDevice ? `data-device="${esc(c.device)}"` : ""}>
    <td>${fmtDate(c.date).slice(0, 10)}</td>${withDevice ? `<td><strong>${esc(c.device)}</strong></td>` : ""}
    <td><span class="sub">${CATEGORY_ICON[c.category] || ""}</span> ${esc(term(c.category))}</td>
    <td class="wrap">${esc(msg(c.message))} ${c.notable ? pill("warn", t("review")) : ""}</td></tr>`;
}

function maxDisk(d) {
  const v = list(d.storage && d.storage.volumes).map(x => x.usedPercent).filter(x => x != null);
  return v.length ? Math.max(...v) : null;
}
function avName(d) {
  const sec = d.security || {};
  const active = list(sec.antivirusProducts).filter(a => a.enabled).map(a => a.name);
  if (active.length) return active.join(", ");
  if (sec.defender && sec.defender.realTimeProtection) return "Windows Defender";
  return null;
}

const COLUMNS = [
  { key: "status", label: "col.status", get: d => LEVELS[d._status], html: d => pill(d._status, levelText(d._status)) },
  { key: "name", label: "col.device", get: d => d.computerName.toLowerCase(), html: d => `<strong>${esc(d.computerName)}</strong>` },
  { key: "model", label: "col.model", get: d => ((d.hardware || {}).model || "").toLowerCase(), html: d => `${dash((d.hardware || {}).manufacturer)}<div class="sub">${dash((d.hardware || {}).model)}</div>` },
  { key: "os", label: "col.windows", get: d => ((d.operatingSystem || {}).build || ""), html: d => `${dash(((d.operatingSystem || {}).name || "").replace("Microsoft ", ""))}<div class="sub">${dash((d.operatingSystem || {}).displayVersion)} · ${t("build")} ${dash((d.operatingSystem || {}).build)}</div>` },
  { key: "ram", label: "col.ram", num: true, get: d => ((d.hardware || {}).memory || {}).totalGB || 0, html: d => num(((d.hardware || {}).memory || {}).totalGB) + " GB" },
  { key: "disk", label: "col.disk", get: d => maxDisk(d) || 0, html: d => meter(maxDisk(d)) },
  { key: "update", label: "col.update", get: d => (((d.operatingSystem || {}).lastUpdate) || {}).date || "", html: d => { const u = (d.operatingSystem || {}).lastUpdate; return u ? `${fmtDate(u.date).slice(0, 10)} <span class="sub">${esc(t("daysAgo", daysSince(u.date)))}</span>` : "—"; } },
  { key: "av", label: "col.av", get: d => avName(d) || "", html: d => avName(d) ? esc(avName(d)) : pill("crit", t("none")) },
  { key: "issues", label: "col.issues", num: true, get: d => d._issues.length, html: d => esc(d._issues.length) },
  { key: "collected", label: "col.collected", get: d => d.collectedAt || "", html: d => fmtDate(d.collectedAt) },
];

/* ---------- views ---------- */
function renderTiles() {
  const count = s => DEVICES.filter(d => d._status === s).length;
  const reboot = DEVICES.filter(d => d.operatingSystem && d.operatingSystem.pendingReboot && d.operatingSystem.pendingReboot.required).length;
  const laptops = DEVICES.filter(d => d.hardware && d.hardware.formFactor === "Laptop").length;
  return `<section class="tiles">
    <div class="tile"><div class="label">${t("tile.devices")}</div><div class="value">${DEVICES.length}</div><div class="sub">${esc(t("tile.split", { l: laptops, d: DEVICES.length - laptops }))}</div></div>
    <div class="tile ok"><div class="label">${t("tile.healthy")}</div><div class="value">${count("ok")}</div></div>
    <div class="tile warn"><div class="label">${t("tile.warnings")}</div><div class="value">${count("warn")}</div></div>
    <div class="tile crit"><div class="label">${t("tile.critical")}</div><div class="value">${count("crit")}</div></div>
    <div class="tile"><div class="label">${t("tile.reboot")}</div><div class="value">${reboot}</div></div>
  </section>`;
}

function renderDevices() {
  const f = state.filter.toLowerCase();
  const col = COLUMNS.find(c => c.key === state.sort.key) || COLUMNS[0];
  const rows = DEVICES
    .filter(d => !f || JSON.stringify([d.computerName, d.hardware, d.operatingSystem && d.operatingSystem.name, d.users]).toLowerCase().includes(f))
    .sort((a, b) => { const x = col.get(a), y = col.get(b); return (x > y ? 1 : x < y ? -1 : 0) * state.sort.dir; });
  const head = COLUMNS.map(c => `<th class="sortable" data-sort="${c.key}">${esc(t(c.label))}${state.sort.key === c.key ? `<span class="arrow">${state.sort.dir > 0 ? "▲" : "▼"}</span>` : ""}</th>`).join("");
  const body = rows.map(d => `<tr class="clickable" data-device="${esc(d.computerName)}">${COLUMNS.map(c => `<td class="${c.num ? "num" : ""}">${c.html(d)}</td>`).join("")}</tr>`).join("");
  currentExport = {
    file: "pcscope-devices.csv",
    headers: ["col.device", "col.status", "col.issues", "col.manufacturer", "col.model", "col.serial", "hw.type", "col.cpu", "col.ram", "col.windows",
      "col.version", "build", "col.update", "col.disk", "col.av", "col.user", "col.ipv4", "col.collected"].map(k => t(k)),
    rows: rows.map(d => {
      const hw = d.hardware || {}, os = d.operatingSystem || {};
      return [d.computerName, levelText(d._status), d._issues.length, hw.manufacturer, hw.model, hw.serialNumber, term(hw.formFactor),
        (hw.cpu || {}).name, (hw.memory || {}).totalGB, os.name, os.displayVersion, os.build, (os.lastUpdate || {}).date,
        maxDisk(d), avName(d), (d.users || {}).lastLoggedOnUser, list(d.network).map(n => list(n.ipv4).join(" ")).join(" "), d.collectedAt];
    }),
  };
  return renderTiles() + `<section class="card">
    <div class="toolbar"><h2>${t("devices.title")}</h2><input type="search" id="filter" placeholder="${esc(t("devices.filter"))}" value="${esc(state.filter)}" aria-label="${esc(t("devices.filter"))}">${exportButton()}</div>
    <div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${COLUMNS.length}" class="empty">${t("devices.none")}</td></tr>`}</tbody></table></div>
  </section>`;
}

function renderIssues() {
  const all = [];
  DEVICES.forEach(d => d._issues.forEach(i => all.push(Object.assign({ device: d.computerName }, i))));
  const byRule = new Map();
  all.forEach(i => byRule.set(i.rule, (byRule.get(i.rule) || 0) + 1));
  const f = state.issueFilter.toLowerCase();
  const rows = all
    .filter(i => !f || [i.device, i.rule, i.text, msg(i.text), levelText(i.level)].join(" ").toLowerCase().includes(f))
    .sort((a, b) => (LEVELS[b.level] - LEVELS[a.level]) || a.device.localeCompare(b.device));
  const top = [...byRule.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6)
    .map(([rule, n]) => `<button class="btn chip${state.issueFilter === rule.toLowerCase() ? " active" : ""}" data-issue-filter="${esc(rule.toLowerCase())}">${esc(rule)} <span class="sub">${n}</span></button>`).join("");
  const body = rows.map(i => `<tr class="clickable" data-device="${esc(i.device)}"><td>${pill(i.level, levelText(i.level))}</td><td><strong>${esc(i.device)}</strong></td><td class="wrap">${esc(msg(i.text))}</td><td><code>${esc(i.rule)}</code></td></tr>`).join("");
  currentExport = {
    file: "pcscope-issues.csv", headers: ["col.severity", "col.device", "col.issue", "col.rule"].map(k => t(k)),
    rows: rows.map(i => [levelText(i.level), i.device, msg(i.text), i.rule]),
  };
  return renderTiles() + `<section class="card">
    <div class="toolbar"><h2>${t("issues.title")} <span class="sub">(${esc(t("ofTotal", { a: rows.length, b: all.length }))})</span></h2><input type="search" id="issuefilter" placeholder="${esc(t("issues.filter"))}" value="${esc(state.issueFilter)}" aria-label="${esc(t("issues.filter"))}">${exportButton()}</div>
    ${top ? `<div class="toolbar chips"><span class="sub">${t("issues.top")}</span>${top}</div>` : ""}
    <div class="table-wrap"><table><thead><tr><th>${t("col.severity")}</th><th>${t("col.device")}</th><th>${t("col.issue")}</th><th>${t("col.rule")}</th></tr></thead>
    <tbody>${body || `<tr><td colspan="4" class="empty">${all.length ? t("issues.noMatch") : t("issues.none")}</td></tr>`}</tbody></table></div>
  </section>`;
}

function renderChanges() {
  const all = [];
  DEVICES.forEach(d => d._changes.forEach(c => all.push(Object.assign({ device: d.computerName }, c))));
  const byCategory = new Map();
  all.forEach(c => byCategory.set(c.category, (byCategory.get(c.category) || 0) + 1));
  const f = state.changeFilter.toLowerCase();
  const rows = all
    .filter(c => (!state.notableOnly || c.notable) && (!f || [c.device, c.category, term(c.category), c.type, c.message, msg(c.message)].join(" ").toLowerCase().includes(f)))
    .sort((a, b) => String(b.date).localeCompare(String(a.date)) || a.device.localeCompare(b.device));
  const notable = all.filter(c => c.notable).length;
  const chips = [`<button class="btn chip${state.notableOnly ? " active" : ""}" data-notable>${t("changes.review")} <span class="sub">${notable}</span></button>`]
    .concat([...byCategory.entries()].sort((a, b) => b[1] - a[1])
      .map(([cat, n]) => `<button class="btn chip${state.changeFilter === cat.toLowerCase() ? " active" : ""}" data-change-filter="${esc(cat.toLowerCase())}">${esc(term(cat))} <span class="sub">${n}</span></button>`)).join("");
  currentExport = {
    file: "pcscope-changes.csv", headers: ["col.date", "col.device", "col.category", "col.type", "col.change", "col.review"].map(k => t(k)),
    rows: rows.map(c => [c.date, c.device, term(c.category), term(c.type), msg(c.message), c.notable ? t("yes") : ""]),
  };
  const tracked = DEVICES.filter(d => d._changes.length).length;
  return `<section class="card">
    <div class="toolbar"><h2>${t("changes.title")} <span class="sub">(${esc(t("ofTotal", { a: rows.length, b: all.length }))} · ${esc(t("changes.tracked", tracked))})</span></h2><input type="search" id="changefilter" placeholder="${esc(t("changes.filter"))}" value="${esc(state.changeFilter)}" aria-label="${esc(t("changes.filter"))}">${exportButton()}</div>
    ${all.length ? `<div class="toolbar chips">${chips}</div>` : ""}
    <div class="table-wrap"><table><thead><tr><th>${t("col.detected")}</th><th>${t("col.device")}</th><th>${t("col.category")}</th><th>${t("col.change")}</th></tr></thead>
    <tbody>${rows.map(c => changeRow(c, true)).join("") || `<tr><td colspan="4" class="empty">${all.length ? t("changes.noMatch") : t("changes.none")}</td></tr>`}</tbody></table></div>
  </section>`;
}

function renderSoftware() {
  const map = new Map();
  for (const d of DEVICES) {
    for (const s of list(d.software)) {
      const key = s.name.toLowerCase();
      if (!map.has(key)) map.set(key, { name: s.name, publisher: s.publisher, versions: new Map() });
      const entry = map.get(key);
      if (!entry.versions.has(s.version)) entry.versions.set(s.version, []);
      entry.versions.get(s.version).push(d.computerName);
    }
  }
  const f = state.swFilter.toLowerCase();
  const items = [...map.values()]
    .filter(s => !f || (s.name + " " + (s.publisher || "")).toLowerCase().includes(f))
    .sort((a, b) => a.name.localeCompare(b.name));
  const rows = items.map(s => {
    const devices = new Set([].concat(...s.versions.values()));
    const versions = [...s.versions.entries()].map(([v, ds]) => `<div>${dash(v)} <span class="sub">— ${esc(ds.join(", "))}</span></div>`).join("");
    return `<tr><td class="wrap"><strong>${esc(s.name)}</strong></td><td class="wrap">${dash(s.publisher)}</td><td class="num">${devices.size}</td><td class="wrap">${versions}</td></tr>`;
  }).join("");
  currentExport = {
    file: "pcscope-software.csv", headers: ["col.program", "col.publisher", "col.version", "col.devices"].map(k => t(k)),
    rows: [].concat(...items.map(s => [...s.versions.entries()].map(([v, ds]) => [s.name, s.publisher, v, ds.join(" ")]))),
  };
  return `<section class="card">
    <div class="toolbar"><h2>${t("software.title")} <span class="sub">(${esc(t("ofTotal", { a: items.length, b: map.size }))})</span></h2><input type="search" id="swfilter" placeholder="${esc(t("software.filter"))}" value="${esc(state.swFilter)}" aria-label="${esc(t("software.filter"))}">${exportButton()}</div>
    <div class="table-wrap"><table><thead><tr><th>${t("col.program")}</th><th>${t("col.publisher")}</th><th>${t("col.devices")}</th><th>${t("col.versions")}</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="4" class="empty">${t("software.none")}</td></tr>`}</tbody></table></div>
  </section>`;
}

function collectedText(d) {
  const c = d.collector || {};
  const how = c.method === "remote" ? "collected.remote" : /\\SYSTEM$|^SYSTEM$/i.test(c.runAs || "") ? "collected.task" : c.method === "local" ? "collected.local" : "collected.plain";
  const parts = [`${esc(t(how))} ${fmtDate(d.collectedAt)}`, esc(t("collected.in", dec(c.durationSeconds)))];
  if (c.runAs) parts.push(esc(t("collected.as", c.runAs)));
  if (c.elevated === false) parts.push(esc(t("collected.noAdmin")));
  return parts.join(" · ");
}

function dl(pairs) {
  return `<dl>${pairs.map(([k, v]) => `<dt>${esc(t(k))}</dt><dd>${v}</dd>`).join("")}</dl>`;
}

function renderDetail(name) {
  const d = DEVICES.find(x => x.computerName === name);
  if (!d) return `<p class="empty">${t("detail.notFound")} <a href="#">${t("detail.backList")}</a></p>`;
  const hw = d.hardware || {}, cpu = hw.cpu || {}, mem = hw.memory || {};
  const os = d.operatingSystem || {}, sec = d.security || {}, users = d.users || {};
  const issues = d._issues.length
    ? `<ul class="issues">${d._issues.map(i => `<li>${pill(i.level, levelText(i.level))}<span>${esc(msg(i.text))}</span></li>`).join("")}</ul>`
    : `<p class="empty">${t("detail.noIssues")}</p>`;

  const volumes = list(d.storage && d.storage.volumes).map(v =>
    `<tr><td><strong>${esc(v.drive)}</strong> <span class="sub">${esc(v.label || "")}</span></td><td class="num">${num(v.sizeGB)} GB</td><td class="num">${num(v.freeGB)} GB</td><td>${meter(v.usedPercent)}</td><td>${esc(term(v.bitLocker))}</td></tr>`).join("");
  const physical = list(d.storage && d.storage.physical).map(p =>
    `<tr><td class="wrap">${esc(p.name)}</td><td>${esc(p.mediaType)} · ${esc(p.busType)}</td><td class="num">${num(p.sizeGB)} GB</td><td>${pill(p.healthStatus === "Healthy" ? "ok" : "crit", term(p.healthStatus || "Unknown"))}</td></tr>`).join("");

  const nets = list(d.network).map(n => `<tr><td class="wrap">${esc(n.description)}</td><td>${esc(list(n.ipv4).join(", "))}</td><td>${esc(n.macAddress)}</td><td>${esc(list(n.gateway).join(", "))}</td><td>${esc(list(n.dnsServers).join(", "))}</td><td>${n.dhcpEnabled ? t("dhcp") : t("static")}</td></tr>`).join("");

  const avRows = list(sec.antivirusProducts).map(a => `${esc(a.name)} ${a.enabled ? pill("ok", t("active")) : pill("info", t("inactive"))} ${a.upToDate ? "" : pill("warn", t("outdated"))}`).join("<br>");
  const fw = list(sec.firewall).map(f => `${esc(term(f.profile))} ${f.enabled ? pill("ok", t("on")) : pill("crit", t("off"))}`).join(" ");
  const admins = list(sec.localAdministrators).map(a => esc(a.name)).join("<br>");

  const software = list(d.software);
  const swRows = software.map(s => `<tr data-sw="${esc((s.name + " " + (s.publisher || "")).toLowerCase())}"><td class="wrap">${esc(s.name)}</td><td>${dash(s.version)}</td><td class="wrap">${dash(s.publisher)}</td><td>${dash(s.installDate)}</td><td>${esc(term(s.scope))}</td></tr>`).join("");

  const errors = list(d.errors).length
    ? `<section class="card span-all"><h3>${t("detail.errors")}</h3><ul class="issues">${list(d.errors).map(e => `<li>${pill("info", term(e.section))}<span>${esc(e.message)}</span></li>`).join("")}</ul></section>` : "";

  return `<div class="detail-head">
      <a class="btn" href="#">${t("detail.back")}</a>
      <h1>${esc(d.computerName)}</h1>${pill(d._status, levelText(d._status))}
      <span class="meta">${collectedText(d)}</span>
    </div>
    <div class="grid">
      <section class="card span-all"><h3>${t("detail.issues")} (${d._issues.length})</h3>${issues}</section>
      <section class="card"><h3>${t("hw.title")}</h3>${dl([
        ["hw.manufacturer", dash(hw.manufacturer)], ["hw.model", dash(hw.model)], ["hw.serial", dash(hw.serialNumber)],
        ["hw.type", dash(term(hw.formFactor))], ["hw.cpu", `${dash(cpu.name)}<div class="sub">${esc(t("hw.cores", { c: cpu.cores, t: cpu.logicalProcessors }))}</div>`],
        ["hw.memory", `${num(mem.totalGB)} GB · ${meter(mem.usedPercent)} ${t("hw.inUse")}<div class="sub">${list(mem.modules).map(m => `${esc(m.slot)}: ${num(m.capacityGB)} GB @ ${esc(m.speedMHz)} MHz`).join("<br>")}</div>`],
        ["hw.bios", `${dash(hw.biosVersion)} <span class="sub">${fmtDate(hw.biosDate).slice(0, 10)}</span>`],
        ...(d.battery ? [["hw.battery", esc(t("hw.batteryText", { h: d.battery.healthPercent == null ? "—" : d.battery.healthPercent, c: d.battery.chargePercent }))]] : []),
      ])}</section>
      <section class="card"><h3>${t("os.title")}</h3>${dl([
        ["os.edition", dash(os.name)], ["os.version", `${dash(os.displayVersion)} <span class="sub">${t("build")} ${dash(os.build)}</span>`],
        ["os.installed", fmtDate(os.installDate)], ["os.lastBoot", `${fmtDate(os.lastBoot)} <span class="sub">${esc(t("os.daysAgo", dec(os.uptimeDays)))}</span>`],
        ["os.lastUpdate", os.lastUpdate ? `${fmtDate(os.lastUpdate.date)}<div class="sub">${esc(os.lastUpdate.title)}</div>` : "—"],
        ["os.reboot", os.pendingReboot ? (os.pendingReboot.required ? `${pill("info", t("yes"))} <span class="sub">${esc(terms(list(os.pendingReboot.reasons).join(", ")))}</span>` : pill("ok", t("no"))) : "—"],
        ["os.domain", `${dash(os.domain)} ${os.partOfDomain ? pill("info", t("domain")) : ""}`],
        ["os.currentUser", dash(users.currentUser)], ["os.lastUser", dash(users.lastLoggedOnUser)],
      ])}</section>
      <section class="card"><h3>${t("sec.title")}</h3>${dl([
        ["sec.antivirus", avRows || "—"],
        ["sec.defender", sec.defender ? `${t("sec.realtime")} ${sec.defender.realTimeProtection ? pill("ok", t("on")) : pill("info", t("off"))}<div class="sub">${t("sec.signatures")} ${fmtDate(sec.defender.signatureLastUpdated)}</div>` : "—"],
        ["sec.firewall", fw || "—"], ["sec.uac", yesNo(sec.uacEnabled)], ["sec.secureBoot", yesNo(sec.secureBoot)],
        ["sec.admins", admins || "—"],
      ])}</section>
      <section class="card span-all"><h3>${t("st.title")}</h3><div class="table-wrap"><table>
        <thead><tr><th>${t("st.volume")}</th><th>${t("st.size")}</th><th>${t("st.free")}</th><th>${t("st.used")}</th><th>${t("st.bitlocker")}</th></tr></thead><tbody>${volumes}</tbody></table></div>
        ${physical ? `<div class="table-wrap"><table><thead><tr><th>${t("st.physical")}</th><th>${t("st.type")}</th><th>${t("st.size")}</th><th>${t("st.health")}</th></tr></thead><tbody>${physical}</tbody></table></div>` : ""}
      </section>
      <section class="card span-all"><h3>${t("net.title")}</h3><div class="table-wrap"><table>
        <thead><tr><th>${t("net.adapter")}</th><th>IPv4</th><th>MAC</th><th>${t("net.gateway")}</th><th>DNS</th><th>${t("net.mode")}</th></tr></thead><tbody>${nets || `<tr><td colspan="6" class="empty">${t("net.none")}</td></tr>`}</tbody></table></div>
      </section>
      <section class="card span-all">
        <div class="toolbar"><h2>${t("sw.title")} <span class="sub">(${software.length})</span></h2><input type="search" id="devsw" placeholder="${esc(t("sw.filter"))}" aria-label="${esc(t("sw.filter"))}"></div>
        <div class="table-wrap"><table><thead><tr><th>${t("col.program")}</th><th>${t("col.version")}</th><th>${t("col.publisher")}</th><th>${t("sw.installed")}</th><th>${t("sw.scope")}</th></tr></thead><tbody id="devswbody">${swRows}</tbody></table></div>
      </section>
      <section class="card span-all"><h3>${t("detail.changes")}${d._changes.length ? ` (${d._changes.length})` : ""}</h3>${d._changes.length
        ? `<div class="table-wrap"><table><thead><tr><th>${t("col.detected")}</th><th>${t("col.category")}</th><th>${t("col.change")}</th></tr></thead><tbody>${d._changes.slice(0, 30).map(c => changeRow(c, false)).join("")}</tbody></table></div>`
        : `<p class="empty">${t("changes.noneDevice")}</p>`}</section>
      ${errors}
    </div>`;
}

/* ---------- routing & events ---------- */
const app = document.getElementById("app");

function renderChrome() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("nav button").forEach(b => { b.textContent = t("nav." + b.dataset.view); });
  const langButton = document.getElementById("lang");
  langButton.textContent = t("lang"); langButton.title = t("langTitle");
  const themeButton = document.getElementById("theme");
  themeButton.textContent = t("theme"); themeButton.title = t("themeTitle");
  document.getElementById("meta").textContent = t("meta", { n: DEVICES.length, d: GENERATED_AT.replace("T", " ").slice(0, 16) });
}

function render() {
  const hash = decodeURIComponent(location.hash.slice(1));
  const deviceName = hash.startsWith("device=") ? hash.slice(7) : null;
  if (["devices", "issues", "changes", "software"].includes(hash)) state.view = hash;
  currentExport = null;
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", String(!deviceName && b.dataset.view === state.view)));
  if (!DEVICES.length) { app.innerHTML = `<p class="empty">${t("noData")}</p>`; return; }
  app.innerHTML = deviceName ? renderDetail(deviceName)
    : state.view === "software" ? renderSoftware()
    : state.view === "issues" ? renderIssues()
    : state.view === "changes" ? renderChanges()
    : renderDevices();
  if (deviceName) window.scrollTo(0, 0);
}

function keepFocus(id, fn) {
  return e => { const pos = e.target.selectionStart; fn(e.target.value); render(); const el = document.getElementById(id); if (el) { el.focus(); el.setSelectionRange(pos, pos); } };
}

app.addEventListener("input", e => {
  if (e.target.id === "filter") keepFocus("filter", v => state.filter = v)(e);
  else if (e.target.id === "swfilter") keepFocus("swfilter", v => state.swFilter = v)(e);
  else if (e.target.id === "issuefilter") keepFocus("issuefilter", v => state.issueFilter = v)(e);
  else if (e.target.id === "changefilter") keepFocus("changefilter", v => state.changeFilter = v)(e);
  else if (e.target.id === "devsw") {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll("#devswbody tr").forEach(tr => tr.classList.toggle("hidden", !!q && !tr.dataset.sw.includes(q)));
  }
});
app.addEventListener("click", e => {
  if (e.target.closest("[data-export]")) { if (currentExport) downloadCsv(currentExport); return; }
  if (e.target.closest("[data-notable]")) { state.notableOnly = !state.notableOnly; render(); return; }
  const changeChip = e.target.closest("[data-change-filter]");
  if (changeChip) {
    state.changeFilter = state.changeFilter === changeChip.dataset.changeFilter ? "" : changeChip.dataset.changeFilter;
    render(); return;
  }
  const chip = e.target.closest("[data-issue-filter]");
  if (chip) {
    state.issueFilter = state.issueFilter === chip.dataset.issueFilter ? "" : chip.dataset.issueFilter;
    render(); return;
  }
  const th = e.target.closest("th[data-sort]");
  if (th) {
    const key = th.dataset.sort;
    state.sort = { key, dir: state.sort.key === key ? -state.sort.dir : 1 };
    render(); return;
  }
  const row = e.target.closest("tr[data-device]");
  if (row) location.hash = "device=" + encodeURIComponent(row.dataset.device);
});
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  state.view = b.dataset.view;
  location.hash = b.dataset.view;   // triggers render() through hashchange
  render();
}));
document.getElementById("lang").addEventListener("click", () => {
  LANG = LANG === "es" ? "en" : "es";
  try { localStorage.setItem("pcscope-lang", LANG); } catch (err) { /* storage unavailable */ }
  renderChrome(); render();
});
document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("pcscope-theme", root.dataset.theme); } catch (err) { /* storage unavailable */ }
});
try { const saved = localStorage.getItem("pcscope-theme"); if (saved) document.documentElement.dataset.theme = saved; } catch (err) { /* storage unavailable */ }
window.addEventListener("hashchange", render);

renderChrome();
render();
</script>
</body>
